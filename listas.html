<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listas curadas — Espacio Cinéfilo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-radius:0;}
:root{
  --bg:#0b0b0e;--bg2:#111115;--bg3:#18181f;
  --gold:#f0c050;--gold2:#c9952e;
  --text:#eeeae3;--text2:#9e9aaa;--text3:#5a5668;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --tr:.18s ease;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;}
a{color:inherit;text-decoration:none;}
button,input,textarea,select{font-family:inherit;}
.serif{font-family:'Fraunces',Georgia,serif;}
.wrap{max-width:1180px;margin:0 auto;padding:0 40px;}
.narrow{max-width:1020px;margin:0 auto;padding:0 40px;}
.rule{height:1px;background:var(--border2);}
.rule-soft{height:1px;background:var(--border);}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:var(--gold2);}
.display{font-family:'Fraunces',Georgia,serif;font-weight:300;letter-spacing:-.025em;line-height:.98;}

header .top{display:flex;align-items:center;gap:20px;height:74px;border-bottom:1px solid var(--border);}
.logo{font-family:'Fraunces',Georgia,serif;font-size:24px;letter-spacing:-.01em;}
.hsep{width:1px;height:22px;background:var(--border2);}
.htag{font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:var(--text3);}
.cta{margin-left:auto;font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;font-weight:500;color:#0b0b0e;background:var(--gold);padding:11px 18px;border:none;cursor:pointer;}
.cta:hover{background:#f6cf6a;}
nav .row{display:flex;gap:26px;overflow-x:auto;border-bottom:1px solid var(--border2);scrollbar-width:none;}
nav .row::-webkit-scrollbar{display:none;}
.nav-btn{font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;font-weight:500;color:var(--text2);padding:15px 0;border-bottom:2px solid transparent;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;cursor:pointer;}
.nav-btn:hover{color:var(--text);}
.nav-btn.on{color:var(--text);border-bottom-color:var(--gold2);}

.ghost{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;font-weight:500;color:var(--text2);border:1px solid var(--border2);padding:10px 16px;background:none;cursor:pointer;transition:var(--tr);}
.ghost:hover{border-color:var(--gold2);color:var(--text);}
.backlink{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--text2);margin-bottom:34px;}
.backlink:hover{color:var(--text);}

/* grid */
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;}
.lcard{display:block;border:1px solid var(--border2);transition:var(--tr);cursor:pointer;}
.lcard:hover{border-color:var(--gold2);transform:translateY(-2px);}
.lcard:hover .ltitle{color:var(--gold);}
.strip{display:flex;gap:8px;padding:20px 24px 0;}
.pmini{width:62px;height:92px;flex:none;background:var(--bg3) center/cover no-repeat;border:1px solid rgba(0,0,0,.5);}
.ltitle{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:28px;line-height:1.08;letter-spacing:-.01em;transition:var(--tr);}

/* detail rows */
.frow{display:grid;grid-template-columns:40px 56px minmax(0,1fr) auto auto;gap:22px;align-items:center;padding:18px 12px;border-bottom:1px solid var(--border);transition:var(--tr);}
.frow:hover{background:var(--bg2);}
.fthumb{width:56px;height:82px;background:var(--bg3) center/cover no-repeat;border:1px solid rgba(255,255,255,.1);}
.ftitle{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:23px;line-height:1.1;}
.rbadge{font-family:'Fraunces',Georgia,serif;font-size:18px;color:var(--gold2);border:1px solid var(--border2);padding:9px 12px;white-space:nowrap;}
.xbtn{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:6px;}
.xbtn:hover{color:#e0796b;}

.field{display:block;margin-bottom:22px;}
.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--text3);margin-bottom:8px;}
.field input,.field textarea,.field select{width:100%;background:var(--bg2);border:1px solid var(--border2);color:var(--text);padding:12px 14px;font-size:15px;}
.field textarea{min-height:90px;resize:vertical;line-height:1.6;}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--gold2);}
.btn-primary{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:500;color:#0b0b0e;background:var(--gold);border:none;padding:14px 28px;cursor:pointer;}
.btn-primary:hover{background:#f6cf6a;}
.btn-danger{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#e0796b;background:none;border:1px solid rgba(224,121,107,.4);padding:14px 22px;cursor:pointer;}
.btn-danger:hover{border-color:#e0796b;}

/* picker */
.pickwrap{border:1px solid var(--border2);margin-top:22px;}
.pickhead{padding:16px;border-bottom:1px solid var(--border);}
.pickhead input{width:100%;background:var(--bg2);border:1px solid var(--border2);color:var(--text);padding:11px 14px;font-size:14px;}
.pickhead input:focus{outline:none;border-color:var(--gold2);}
.presults{max-height:360px;overflow-y:auto;}
.presult{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;}
.presult:hover{background:var(--bg2);}
.presult .pt{width:40px;height:58px;background:var(--bg3) center/cover no-repeat;}
.addpill{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold2);border:1px solid var(--border2);padding:6px 10px;}

footer{border-top:1px solid var(--border2);margin-top:72px;}
footer .in{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;padding:26px 0;}
@media(max-width:860px){
  .wrap,.narrow{padding:0 20px;}
  .display{font-size:52px !important;}
  .lgrid{grid-template-columns:1fr;}
  .frow{grid-template-columns:30px 48px minmax(0,1fr) auto;}
  .frow .xbtn{display:none;}
}
.loading{padding:80px 40px;text-align:center;color:var(--text3);}
</style>
</head>
<body>

<header>
  <div class="wrap top">
    <a class="logo" href="index.html">Espacio Cinéfilo</a>
    <div class="hsep"></div>
    <div class="htag">Listas curadas · Selecciones de autor</div>
    <button class="cta" onclick="location.hash='#/new'">+ Nueva lista</button>
  </div>
  <nav><div class="wrap row">
    <button class="nav-btn" onclick="location.href='index.html'">Inicio</button>
    <button class="nav-btn" onclick="location.href='index.html'">Catálogo</button>
    <button class="nav-btn" onclick="location.href='index.html'">Ranking</button>
    <button class="nav-btn on">Listas</button>
    <button class="nav-btn" onclick="location.href='blog.html'">Cuaderno</button>
    <button class="nav-btn" onclick="location.href='index.html'">Estadísticas</button>
  </div></nav>
</header>

<main id="view"><div class="loading">Cargando tu biblioteca…</div></main>

<footer><div class="wrap in">
  <div class="serif" style="font-size:16px;">Espacio Cinéfilo</div>
  <div style="font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--text3);">Listas curadas · desde 2026</div>
</div></footer>

<script>
const LS_KEY='ec_listas';
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const TAGS=['Por director','Por país','Por década','Por humor','Otra'];
let FILMS=[], FMAP={}, LISTS=[];

const esc=s=>(''+(s==null?'':s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function num(f){ const r=parseFloat(f&&f.rating); return isNaN(r)?0:r; }
function fmtDate(iso){ const d=new Date(iso); if(isNaN(d)) return ''; return d.getDate()+' '+MESES[d.getMonth()]+' '+d.getFullYear(); }

function seedLists(){
  const kuro=FILMS.filter(f=>/kurosawa/i.test(f.director||'')).sort((a,b)=>num(b)-num(a)).slice(0,14).map(f=>f.id);
  const tens=FILMS.filter(f=>num(f)===10).sort((a,b)=>(a.year||0)-(b.year||0)).slice(0,20).map(f=>f.id);
  const berg=FILMS.filter(f=>/bergman/i.test(f.director||'')).sort((a,b)=>num(b)-num(a)).slice(0,12).map(f=>f.id);
  const now=Date.now();
  return [
    {id:'l1',title:'Kurosawa, de principio a fin',tag:'Por director',note:'Las que tengo del maestro, en orden de nota. Si alguien me pregunta por dónde entrar, mando las tres primeras y espero.',filmIds:kuro,notes:{},createdAt:now,updatedAt:now},
    {id:'l2',title:'Los dieces: cine sin reproche',tag:'Por humor',note:'Las de nota perfecta en mi biblioteca. El techo, sin orden jerárquico.',filmIds:tens,notes:{},createdAt:now,updatedAt:now},
    {id:'l3',title:'Bergman y el rostro',tag:'Por director',note:'Sobre la cara humana como paisaje. Del Séptimo sello a Sonata de otoño.',filmIds:berg,notes:{},createdAt:now,updatedAt:now}
  ];
}
function loadLists(){
  try{const r=localStorage.getItem(LS_KEY); if(r){const l=JSON.parse(r); if(Array.isArray(l)) return l;}}catch(e){}
  const s=seedLists(); localStorage.setItem(LS_KEY,JSON.stringify(s)); return s;
}
function saveLists(){ LISTS.forEach(l=>l.updatedAt=l.updatedAt||Date.now()); localStorage.setItem(LS_KEY,JSON.stringify(LISTS)); }

function listFilms(l){ return (l.filmIds||[]).map(id=>FMAP[id]).filter(Boolean); }
function listAvg(l){ const fs=listFilms(l); if(!fs.length) return '—'; return (fs.reduce((s,f)=>s+num(f),0)/fs.length).toFixed(1); }

function viewIndex(){
  const cards=LISTS.map((l,i)=>{
    const fs=listFilms(l);
    const posters=fs.filter(f=>f.poster).slice(0,5);
    return `<a class="lcard" href="#/list/${l.id}">
      <div class="strip">${posters.map(f=>`<div class="pmini" style="background-image:url('${esc(f.poster)}');"></div>`).join('')||'<div style="height:92px;"></div>'}</div>
      <div style="padding:22px 24px 24px;">
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:10px;">
          <span class="serif" style="font-size:16px;color:var(--text3);">${String(i+1).padStart(2,'0')}</span>
          <span style="font-size:9.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold2);">${esc(l.tag)}</span>
        </div>
        <h3 class="ltitle" style="margin-bottom:12px;">${esc(l.title)}</h3>
        <p style="font-size:14px;line-height:1.6;color:var(--text2);margin-bottom:18px;min-height:44px;">${esc(l.note)}</p>
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);border-top:1px solid var(--border);padding-top:14px;">${fs.length} películas · prom ${listAvg(l)} · act. ${fmtDate(l.updatedAt)}</div>
      </div>
    </a>`;
  }).join('');
  return `
  <section class="wrap" style="padding:64px 40px 40px;">
    <div class="eyebrow" style="margin-bottom:22px;">Listas curadas · Selecciones de autor</div>
    <div style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between;">
      <h1 class="display" style="font-size:76px;">Listas</h1>
      <p style="font-size:15px;line-height:1.7;color:var(--text2);max-width:46ch;margin-bottom:10px;">Agrupo películas de la biblioteca con un criterio propio y una nota. No son rankings: son recorridos para que alguien más sepa por dónde entrar.</p>
    </div>
  </section>
  <div class="wrap"><div style="display:flex;gap:20px;align-items:center;padding:16px 0;border-top:1px solid var(--border2);border-bottom:1px solid var(--border);">
    <span style="font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--text);">Todas · ${LISTS.length}</span>
    <span style="margin-left:auto;font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--text3);">Actualizadas ▾</span>
  </div></div>
  <section class="wrap" style="padding:40px 40px 0;">
    ${LISTS.length?`<div class="lgrid">${cards}</div>`:'<p style="color:var(--text3);padding:40px 0;">Aún no tienes listas. Crea una con “+ Nueva lista”.</p>'}
  </section>`;
}

function viewDetail(id){
  const l=LISTS.find(x=>x.id===id);
  if(!l) return `<section class="narrow" style="padding:80px 40px;"><a class="backlink" href="#/">← Listas</a><h1 class="serif" style="font-size:36px;">Lista no encontrada.</h1></section>`;
  const fs=listFilms(l);
  const rows=fs.map((f,i)=>`
    <div class="frow">
      <div class="serif" style="font-size:20px;color:var(--text3);text-align:center;">${String(i+1).padStart(2,'0')}</div>
      <div class="fthumb" style="${f.poster?`background-image:url('${esc(f.poster)}');`:''}"></div>
      <div style="min-width:0;">
        <h3 class="ftitle" style="margin-bottom:5px;">${esc(f.title)} <span style="color:var(--text3);font-size:18px;">${esc(f.year||'')}</span></h3>
        <div style="font-size:12px;color:var(--text2);margin-bottom:7px;">${esc(f.director||'—')}${f.country?' · '+esc(f.country):''}</div>
        <p style="font-size:13px;line-height:1.5;color:#6f6b7a;margin:0;font-style:italic;">${esc((l.notes&&l.notes[f.id])||f.comment||'')}</p>
      </div>
      <div class="rbadge">${num(f)?num(f):'—'}</div>
      <button class="xbtn" title="Quitar de la lista" onclick="removeFilm('${l.id}','${f.id}')">×</button>
    </div>`).join('');
  return `
  <section class="narrow" style="padding:52px 40px 0;">
    <a class="backlink" href="#/">← Listas</a>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;">
      <div class="eyebrow" style="margin-bottom:20px;">Lista curada · ${esc(l.tag)}</div>
      <div style="display:flex;gap:10px;">
        <button class="ghost" onclick="location.hash='#/edit/${l.id}'">Editar</button>
        <button class="ghost" onclick="delList('${l.id}')">Eliminar</button>
      </div>
    </div>
    <h1 class="display" style="font-size:60px;margin-bottom:22px;max-width:16ch;">${esc(l.title)}</h1>
    <p style="font-size:17px;line-height:1.72;color:var(--text2);max-width:60ch;margin-bottom:28px;">${esc(l.note)}</p>
    <div style="display:flex;flex-wrap:wrap;gap:18px;align-items:center;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);padding-bottom:30px;border-bottom:1px solid var(--border2);">
      <span style="color:var(--text);">${fs.length} películas</span><span style="color:#2f2c38;">/</span>
      <span>Promedio ${listAvg(l)}</span><span style="color:#2f2c38;">/</span>
      <span>Por Andrés</span><span style="color:#2f2c38;">/</span>
      <span>Actualizada ${fmtDate(l.updatedAt)}</span>
    </div>
  </section>
  <section class="narrow" style="padding:8px 40px 0;">
    ${rows||'<p style="color:var(--text3);padding:30px 0;">Esta lista está vacía. Añade películas abajo.</p>'}
    <div style="margin-top:26px;">
      <div class="eyebrow" style="margin-bottom:12px;">Añadir película</div>
      <div class="pickwrap">
        <div class="pickhead"><input id="pick" type="text" placeholder="Busca por título o director…" oninput="renderPick('${l.id}')"></div>
        <div class="presults" id="presults"></div>
      </div>
    </div>
  </section>`;
}

function renderPick(listId){
  const q=(document.getElementById('pick').value||'').trim().toLowerCase();
  const box=document.getElementById('presults');
  if(q.length<2){ box.innerHTML='<div style="padding:16px;color:var(--text3);font-size:13px;">Escribe al menos dos letras…</div>'; return; }
  const l=LISTS.find(x=>x.id===listId);
  const inList=new Set(l.filmIds||[]);
  const res=FILMS.filter(f=>!inList.has(f.id)&&((f.title||'').toLowerCase().includes(q)||(f.director||'').toLowerCase().includes(q)))
    .sort((a,b)=>num(b)-num(a)).slice(0,25);
  box.innerHTML=res.map(f=>`
    <div class="presult" onclick="addFilm('${listId}','${f.id}')">
      <div class="pt" style="${f.poster?`background-image:url('${esc(f.poster)}');`:''}"></div>
      <div style="min-width:0;"><div class="serif" style="font-size:16px;">${esc(f.title)} <span style="color:var(--text3);font-size:13px;">${esc(f.year||'')}</span></div><div style="font-size:12px;color:var(--text2);">${esc(f.director||'—')}${f.country?' · '+esc(f.country):''}</div></div>
      <div class="addpill">+ Añadir</div>
    </div>`).join('')||'<div style="padding:16px;color:var(--text3);font-size:13px;">Sin resultados.</div>';
}
function addFilm(listId,filmId){
  const l=LISTS.find(x=>x.id===listId); if(!l) return;
  l.filmIds=l.filmIds||[]; if(!l.filmIds.includes(filmId)) l.filmIds.push(filmId);
  l.updatedAt=Date.now(); saveLists(); render();
  const p=document.getElementById('pick'); if(p){p.focus();}
}
function removeFilm(listId,filmId){
  const l=LISTS.find(x=>x.id===listId); if(!l) return;
  l.filmIds=(l.filmIds||[]).filter(x=>x!==filmId); l.updatedAt=Date.now(); saveLists(); render();
}

function viewEditor(id){
  const l=id?LISTS.find(x=>x.id===id):null;
  const v=l||{tag:'Por director'};
  return `
  <section class="narrow" style="max-width:720px;padding:52px 40px 0;">
    <a class="backlink" href="${l?('#/list/'+l.id):'#/'}">← ${l?'Cancelar':'Listas'}</a>
    <h1 class="serif" style="font-weight:300;font-size:40px;letter-spacing:-.02em;margin-bottom:32px;">${l?'Editar lista':'Nueva lista'}</h1>
    <form onsubmit="saveForm(event,'${l?l.id:''}')">
      <div class="field"><label>Título de la lista</label><input name="title" required value="${esc(v.title||'')}" placeholder="Ej: Cine negro de los 50"></div>
      <div class="field"><label>Criterio</label><select name="tag">${TAGS.map(t=>`<option ${t===v.tag?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>Nota de curaduría</label><textarea name="note" placeholder="¿Por qué juntas estas películas? ¿Por dónde entrar?">${esc(v.note||'')}</textarea></div>
      <div style="display:flex;gap:14px;align-items:center;padding:8px 0 20px;">
        <button type="submit" class="btn-primary">${l?'Guardar cambios':'Crear lista'}</button>
        ${l?`<button type="button" class="btn-danger" onclick="delList('${l.id}')">Eliminar</button>`:''}
      </div>
      ${!l?'<p style="font-size:13px;color:var(--text3);">Después de crearla podrás añadir películas desde tu biblioteca.</p>':''}
    </form>
  </section>`;
}
function saveForm(ev,id){
  ev.preventDefault(); const f=ev.target;
  const data={title:f.title.value.trim(),tag:f.tag.value,note:f.note.value.trim()};
  if(id){ const l=LISTS.find(x=>x.id===id); Object.assign(l,data); l.updatedAt=Date.now(); saveLists(); location.hash='#/list/'+id; }
  else { const nl={id:'l'+Date.now(),...data,filmIds:[],notes:{},createdAt:Date.now(),updatedAt:Date.now()}; LISTS.push(nl); saveLists(); location.hash='#/list/'+nl.id; }
}
function delList(id){
  if(!confirm('¿Eliminar esta lista? No se puede deshacer.')) return;
  LISTS=LISTS.filter(x=>x.id!==id); saveLists(); location.hash='#/';
}

function render(){
  const h=location.hash||'#/'; const el=document.getElementById('view'); let m,html;
  if((m=h.match(/^#\/list\/(.+)$/))) html=viewDetail(m[1]);
  else if((m=h.match(/^#\/edit\/(.+)$/))) html=viewEditor(m[1]);
  else if(h==='#/new') html=viewEditor(null);
  else html=viewIndex();
  el.innerHTML=html; window.scrollTo(0,0);
  if(h.match(/^#\/list\//)){ const b=document.getElementById('presults'); if(b) b.innerHTML='<div style="padding:16px;color:var(--text3);font-size:13px;">Escribe al menos dos letras…</div>'; }
}
window.addEventListener('hashchange',render);

fetch('films_data.json').then(r=>r.json()).then(data=>{
  FILMS=Array.isArray(data)?data:(data.films||[]);
  FILMS.forEach(f=>{ if(f.id==null) f.id='f'+Math.random().toString(36).slice(2); FMAP[f.id]=f; });
  LISTS=loadLists();
  render();
}).catch(e=>{
  document.getElementById('view').innerHTML='<div class="loading">No pude cargar tu biblioteca (films_data.json). Recarga la página.</div>';
});
</script>
</body>
</html>
