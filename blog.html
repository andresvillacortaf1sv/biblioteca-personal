<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuaderno — Espacio Cinéfilo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-radius:0;}
:root{
  --bg:#0b0b0e;--bg2:#111115;--bg3:#18181f;
  --gold:#f0c050;--gold2:#c9952e;
  --text:#eeeae3;--text2:#9e9aaa;--text3:#5a5668;--prose:#cfcad0;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --tr:.18s ease;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;}
a{color:inherit;text-decoration:none;}
button,input,textarea,select{font-family:inherit;}
.serif{font-family:'Fraunces',Georgia,serif;}
.wrap{max-width:1180px;margin:0 auto;padding:0 40px;}
.narrow{max-width:720px;margin:0 auto;padding:0 40px;}
.rule{height:1px;background:var(--border2);}
.rule-soft{height:1px;background:var(--border);}

/* HEADER */
header .top{display:flex;align-items:center;gap:20px;height:74px;border-bottom:1px solid var(--border);}
.logo{font-family:'Fraunces',Georgia,serif;font-size:24px;letter-spacing:-.01em;}
.hsep{width:1px;height:22px;background:var(--border2);}
.htag{font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:var(--text3);}
.cta{margin-left:auto;font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;font-weight:500;color:#0b0b0e;background:var(--gold);padding:11px 18px;border:none;cursor:pointer;}
.cta:hover{background:#f6cf6a;}
nav .row{display:flex;gap:26px;overflow-x:auto;border-bottom:1px solid var(--border2);scrollbar-width:none;}
nav .row::-webkit-scrollbar{display:none;}
.nav-btn{font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;font-weight:500;color:var(--text2);padding:15px 0;border-bottom:2px solid transparent;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;cursor:pointer;}
.nav-btn:hover{color:var(--text);}
.nav-btn.on{color:var(--text);border-bottom-color:var(--gold2);}

/* HERO */
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:var(--gold2);}
.display{font-family:'Fraunces',Georgia,serif;font-weight:300;letter-spacing:-.025em;line-height:.98;}

/* ENTRY LIST */
.entry{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:24px;align-items:baseline;padding:26px 12px;border-top:1px solid var(--border);transition:var(--tr);cursor:pointer;}
.entry:hover{background:var(--bg2);}
.entry:hover .etitle{color:var(--gold);}
.enum{font-family:'Fraunces',Georgia,serif;font-size:22px;color:var(--text3);}
.kicker{font-size:9.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold2);}
.etitle{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:26px;line-height:1.12;letter-spacing:-.01em;transition:var(--tr);}
.emeta{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);text-align:right;white-space:nowrap;}
.ghost{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;font-weight:500;color:var(--text);border:1px solid var(--border2);padding:13px 26px;background:none;cursor:pointer;transition:var(--tr);}
.ghost:hover{border-color:var(--gold2);}

/* ASIDE */
.panel{border:1px solid var(--border);padding:28px;}
.panel+.panel{border-top:none;}
.plabel{font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:var(--text3);margin-bottom:16px;}
.srow{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid var(--border);font-size:14px;}
.chip{font-size:11px;letter-spacing:.04em;color:var(--text2);border:1px solid var(--border2);padding:7px 12px;transition:var(--tr);}
.chip:hover{border-color:var(--gold2);color:var(--text);}

/* ARTICLE */
.prose p{font-size:17px;line-height:1.78;color:var(--prose);margin:0 0 24px;}
.prose p .drop{float:left;font-family:'Fraunces',Georgia,serif;font-weight:300;font-size:78px;line-height:.74;padding:6px 14px 0 0;color:var(--gold);}
.pullquote{margin:38px 0;padding:4px 0 4px 28px;border-left:2px solid var(--gold2);}
.pullquote p{font-family:'Fraunces',Georgia,serif;font-weight:400;font-style:italic;font-size:27px;line-height:1.35;color:var(--text);margin:0;}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text2);border:1px solid var(--border2);padding:7px 12px;}

/* EDITOR */
.field{display:block;margin-bottom:22px;}
.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--text3);margin-bottom:8px;}
.field input,.field textarea,.field select{width:100%;background:var(--bg2);border:1px solid var(--border2);color:var(--text);padding:12px 14px;font-size:15px;}
.field textarea{min-height:260px;resize:vertical;line-height:1.7;font-family:inherit;}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--gold2);}
.btn-primary{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:500;color:#0b0b0e;background:var(--gold);border:none;padding:14px 28px;cursor:pointer;}
.btn-primary:hover{background:#f6cf6a;}
.btn-danger{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#e0796b;background:none;border:1px solid rgba(224,121,107,.4);padding:14px 22px;cursor:pointer;}
.btn-danger:hover{border-color:#e0796b;}

footer{border-top:1px solid var(--border2);margin-top:72px;}
footer .in{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;padding:26px 0;}

@media(max-width:860px){
  .wrap,.narrow{padding:0 20px;}
  .display{font-size:52px !important;}
  .entry{grid-template-columns:36px minmax(0,1fr);}
  .entry .emeta{display:none;}
}
.hidden{display:none !important;}
.backlink{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--text2);margin-bottom:34px;}
.backlink:hover{color:var(--text);}
</style>
</head>
<body>

<header>
  <div class="wrap top">
    <a class="logo" href="index.html">Espacio Cinéfilo</a>
    <div class="hsep"></div>
    <div class="htag">Cuaderno · Escritos desde la butaca</div>
    <button class="cta" onclick="location.hash='#/new'">+ Nueva entrada</button>
  </div>
  <nav><div class="wrap row">
    <button class="nav-btn" onclick="location.href='index.html'">Inicio</button>
    <button class="nav-btn" onclick="location.href='index.html'">Catálogo</button>
    <button class="nav-btn" onclick="location.href='index.html'">Ranking</button>
    <button class="nav-btn" onclick="location.href='listas.html'">Listas</button>
    <button class="nav-btn on">Cuaderno</button>
    <button class="nav-btn" onclick="location.href='index.html'">Estadísticas</button>
  </div></nav>
</header>

<main id="view"></main>

<footer><div class="wrap in">
  <div class="serif" style="font-size:16px;">Espacio Cinéfilo</div>
  <div style="font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--text3);">Cuaderno · desde 2026</div>
</div></footer>

<script>
const LS_KEY='ec_cuaderno_posts';
const SECTIONS=['Ensayo','Crítica','Diario','Técnica','Lista comentada'];
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

const SEED=[
  {id:'p1',pinned:true,section:'Ensayo',title:'Ver y volver a ver: el reloj interno del espectador',
   dek:'Hay películas que la primera vez te ganan por la trama y la segunda por el montaje. Sobre el rewatch como forma de lectura.',
   cover:'https://image.tmdb.org/t/p/w500/2C3k44qqbaqJ0JfJyXVI6r7IWMr.jpg',
   date:'2026-10-12',tags:['Montaje','Rewatch','Murch'],
   body:`Hay una idea cómoda que conviene dejar atrás: que una película se ve una vez y ya está leída. No es así. La primera proyección es casi siempre un secuestro: la trama tira de nosotros y apenas alcanzamos a registrar de qué está hecha. Recién en la segunda, sabiendo a dónde vamos, empezamos a mirar.

Lo noté ordenando mi propia biblioteca. Las películas con más revisiones no son las que más me gustaron de entrada, sino las que me dejaron una pregunta. 8½ la he puesto más veces que ninguna, y nunca por la historia —que a estas alturas me sé— sino por el ritmo de sus transiciones.

> El rewatch no es nostalgia. Es la única forma de leer un montaje con los ojos quietos.

El montaje se entiende de atrás hacia adelante. Walter Murch lo escribió mejor que nadie en En el momento del parpadeo: cortamos donde el ojo ya decidió dejar de mirar. La segunda vez, uno empieza a sentir esos cortes antes de que ocurran, como si la película respirara al compás de uno.

Mi regla, si existe, es simple: una película se queda en la biblioteca cuando mejora en la segunda vuelta. Las que se agotan en la primera salen a la semana.`},
  {id:'p2',section:'Crítica',title:'Harakiri y la geometría del honor',date:'2026-10-09',tags:['Kobayashi','Japón'],
   dek:'Kobayashi encuadra el ritual como una trampa de líneas rectas. Un plano a plano de la secuencia final.',
   body:`[Escribe aquí tu crítica.] Este es un texto de ejemplo que puedes reemplazar por completo desde el botón "Editar".

Kobayashi compone en rectas: el patio, los biombos, las lanzas. Todo converge hacia un centro del que el protagonista no puede salir.`},
  {id:'p3',section:'Diario',title:'Tres noches con Bergman',date:'2026-10-05',tags:['Bergman','Suecia'],
   dek:'Sonata de otoño, Persona y Gritos y susurros seguidas. Lo que queda cuando el rostro ocupa toda la pantalla.',
   body:`[Texto de ejemplo.] Tres noches, tres películas, un mismo rostro repetido hasta volverse paisaje.

Reemplaza este contenido con tu propia entrada de diario.`},
  {id:'p4',section:'Lista comentada',title:'Por qué 8½ encabeza mi ranking',date:'2026-09-28',tags:['Fellini','Ranking'],
   dek:'No es la mejor película que he visto; es la que mejor explica por qué sigo viendo. Defensa de un número uno.',
   body:`[Texto de ejemplo.] Defender un número uno es defender un criterio. El mío es simple: ¿qué película explica mejor por qué sigo viendo cine?

Reemplaza este contenido.`},
  {id:'p5',section:'Técnica',title:'Lo que aprendí colorizando en Lumetri',date:'2026-09-21',tags:['Color','Premiere'],
   dek:'De LOG a Rec.709 sin matar las sombras. Notas de taller que terminaron cambiando cómo miro el color ajeno.',
   body:`[Texto de ejemplo.] Trabajar el color propio cambia cómo lees el ajeno. De LOG a Rec.709 hay más decisiones de las que parece.

Reemplaza este contenido con tus notas de taller.`}
];

function load(){ try{const r=localStorage.getItem(LS_KEY); if(r) return JSON.parse(r);}catch(e){} localStorage.setItem(LS_KEY,JSON.stringify(SEED)); return JSON.parse(JSON.stringify(SEED)); }
function save(p){ localStorage.setItem(LS_KEY,JSON.stringify(p)); }
let POSTS=load();

const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(iso){ const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return esc(iso); return d.getDate()+' '+MESES[d.getMonth()]+' '+d.getFullYear(); }
function readMin(body){ const w=(body||'').split(/\s+/).length; return Math.max(2,Math.round(w/200)); }
function byDateDesc(a,b){ return (b.date||'').localeCompare(a.date||''); }

function renderBodyHTML(body){
  const blocks=(body||'').split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  return blocks.map((b,i)=>{
    if(b.startsWith('> ')) return '<blockquote class="pullquote"><p>'+esc(b.slice(2))+'</p></blockquote>';
    const inner=esc(b);
    if(i===0) return '<p><span class="drop">'+inner.charAt(0)+'</span>'+inner.slice(1)+'</p>';
    return '<p>'+inner+'</p>';
  }).join('');
}

function viewList(){
  const posts=[...POSTS].sort(byDateDesc);
  const featured=posts.find(p=>p.pinned)||posts[0];
  const rest=posts.filter(p=>p!==featured);
  const counts={}; SECTIONS.forEach(s=>counts[s]=0); POSTS.forEach(p=>{counts[p.section]=(counts[p.section]||0)+1;});
  const months={}; POSTS.forEach(p=>{const d=new Date(p.date+'T00:00:00'); if(!isNaN(d)){const k=MESES[d.getMonth()]+' '+d.getFullYear(); months[k]=1;}});
  return `
  <section class="wrap" style="padding:64px 40px 40px;">
    <div class="eyebrow" style="margin-bottom:22px;">Cuaderno · Escritos desde la butaca</div>
    <h1 class="display" style="font-size:76px;margin-bottom:24px;max-width:14ch;">El cuaderno</h1>
    <p style="font-size:16px;line-height:1.7;color:var(--text2);max-width:62ch;">Notas, ensayos y diarios sobre lo que veo. Un lugar para escribir de más largo que un comentario de ficha: por qué una película se queda, qué aprendo mirándola dos veces, y cómo eso se refleja en la biblioteca.</p>
  </section>
  <div class="wrap"><div class="rule"></div></div>
  ${featured?`
  <section class="wrap" style="padding:48px 40px 0;">
    <a href="#/post/${featured.id}" style="display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:44px;align-items:start;">
      <div>
        <div class="eyebrow" style="letter-spacing:.2em;margin-bottom:18px;">Destacado · ${esc(featured.section)}</div>
        <h2 class="serif" style="font-weight:400;font-size:44px;line-height:1.04;letter-spacing:-.02em;margin-bottom:18px;">${esc(featured.title)}</h2>
        <p style="font-size:15px;line-height:1.75;color:var(--text2);max-width:54ch;margin-bottom:22px;">${esc(featured.dek)}</p>
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--text3);">${fmtDate(featured.date)} &nbsp;·&nbsp; ${esc(featured.section)} &nbsp;·&nbsp; ${readMin(featured.body)} min de lectura</div>
      </div>
      <div style="aspect-ratio:3/4;background:var(--bg3) center/cover no-repeat;${featured.cover?`background-image:url('${esc(featured.cover)}');`:''}border:1px solid var(--border2);"></div>
    </a>
  </section>`:''}
  <div class="wrap" style="margin-top:48px;"><div class="rule-soft"></div></div>
  <section class="wrap" style="padding:40px 40px 0;display:flex;flex-wrap:wrap;gap:56px;">
    <div style="flex:999 1 560px;min-width:0;">
      <div class="plabel" style="margin-bottom:8px;">Últimas entradas</div>
      ${rest.map((p,i)=>`
        <a class="entry" href="#/post/${p.id}">
          <div class="enum">${String(i+1).padStart(2,'0')}</div>
          <div>
            <div class="kicker" style="margin-bottom:10px;">${esc(p.section)}</div>
            <h3 class="etitle" style="margin-bottom:10px;">${esc(p.title)}</h3>
            <p style="font-size:14px;line-height:1.65;color:var(--text2);max-width:60ch;">${esc(p.dek)}</p>
          </div>
          <div class="emeta">${fmtDate(p.date)}</div>
        </a>`).join('')}
      ${rest.length===0?'<p style="color:var(--text3);padding:30px 0;">Aún no hay más entradas. Crea una con “+ Nueva entrada”.</p>':''}
    </div>
    <aside style="flex:1 1 280px;min-width:0;">
      <div class="panel">
        <div class="plabel">Secciones</div>
        ${SECTIONS.map(s=>`<div class="srow"><span class="serif">${s}</span><span style="font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums;">${counts[s]||0}</span></div>`).join('')}
      </div>
      <div class="panel">
        <div class="plabel">Archivo</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          ${Object.keys(months).slice(0,6).map(m=>`<span class="chip">${m}</span>`).join('')||'<span class="chip">—</span>'}
        </div>
      </div>
      <div class="panel" style="background:var(--gold);color:#0b0b0e;border-color:var(--gold);">
        <div class="serif" style="font-size:21px;line-height:1.2;margin-bottom:10px;">Boletín semanal</div>
        <p style="font-size:13px;line-height:1.6;margin-bottom:16px;color:#2a230f;">Lo que escribí y lo que vi esta semana, directo a tu correo.</p>
        <form onsubmit="subscribe(event)" style="display:flex;">
          <label for="nl" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Correo</label>
          <input id="nl" type="email" required placeholder="tu@correo.com" style="flex:1 1 auto;min-width:0;border:1px solid #0b0b0e;background:transparent;color:#0b0b0e;padding:11px 12px;font-size:13px;">
          <button type="submit" style="border:1px solid #0b0b0e;background:#0b0b0e;color:var(--gold);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;padding:0 16px;cursor:pointer;">Ok</button>
        </form>
      </div>
    </aside>
  </section>`;
}

function viewPost(id){
  const p=POSTS.find(x=>x.id===id);
  if(!p) return `<section class="narrow" style="padding:80px 40px;"><a class="backlink" href="#/">← Cuaderno</a><h1 class="serif" style="font-size:36px;">Entrada no encontrada.</h1></section>`;
  const related=POSTS.filter(x=>x.id!==id).sort(byDateDesc).slice(0,3);
  return `
  <article>
    <div class="narrow" style="padding:52px 40px 0;">
      <a class="backlink" href="#/">← Cuaderno</a>
      <div class="eyebrow" style="margin-bottom:20px;">${esc(p.section)}</div>
      <h1 class="serif" style="font-weight:300;font-size:52px;line-height:1.05;letter-spacing:-.02em;margin-bottom:22px;">${esc(p.title)}</h1>
      <p style="font-size:19px;line-height:1.6;color:var(--text2);margin-bottom:26px;">${esc(p.dek)}</p>
      <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);padding-bottom:36px;border-bottom:1px solid var(--border2);">
        <span>Por Andrés</span><span style="color:#2f2c38;">/</span><span>${fmtDate(p.date)}</span><span style="color:#2f2c38;">/</span><span>${readMin(p.body)} min</span>
        <span style="margin-left:auto;display:flex;gap:10px;">
          <a href="#/edit/${p.id}" style="color:var(--gold2);">Editar</a>
        </span>
      </div>
    </div>
    ${p.cover?`<div style="max-width:1020px;margin:40px auto 0;padding:0 40px;">
      <div style="aspect-ratio:21/9;background:var(--bg3) center 30%/cover no-repeat;background-image:url('${esc(p.cover)}');border:1px solid var(--border2);"></div>
    </div>`:''}
    <div class="prose narrow" style="padding:48px 40px 0;">
      ${renderBodyHTML(p.body)}
      ${(p.tags&&p.tags.length)?`<div style="display:flex;flex-wrap:wrap;gap:8px;padding:36px 0;border-top:1px solid var(--border);margin-top:40px;">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
    </div>
  </article>
  ${related.length?`<section style="max-width:1020px;margin:0 auto;padding:16px 40px 0;">
    <div class="plabel" style="border-top:1px solid var(--border2);padding-top:30px;">Más del cuaderno</div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:22px;">
      ${related.map(r=>`<a href="#/post/${r.id}" style="display:block;">
        <div class="kicker" style="margin-bottom:10px;">${esc(r.section)}</div>
        <h4 class="serif" style="font-weight:400;font-size:20px;line-height:1.18;margin-bottom:8px;">${esc(r.title)}</h4>
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);">${fmtDate(r.date)}</div>
      </a>`).join('')}
    </div>
  </section>`:''}`;
}

function viewEditor(id){
  const p=id?POSTS.find(x=>x.id===id):null;
  const v=p||{section:'Ensayo',date:new Date().toISOString().slice(0,10),tags:[]};
  return `
  <section class="narrow" style="padding:52px 40px 0;">
    <a class="backlink" href="${p?('#/post/'+p.id):'#/'}">← ${p?'Cancelar':'Cuaderno'}</a>
    <h1 class="serif" style="font-weight:300;font-size:40px;letter-spacing:-.02em;margin-bottom:32px;">${p?'Editar entrada':'Nueva entrada'}</h1>
    <form onsubmit="saveForm(event,'${p?p.id:''}')">
      <div class="field"><label>Título</label><input name="title" required value="${esc(v.title||'')}"></div>
      <div style="display:flex;gap:22px;flex-wrap:wrap;">
        <div class="field" style="flex:1 1 200px;"><label>Sección</label><select name="section">${SECTIONS.map(s=>`<option ${s===v.section?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="field" style="flex:1 1 160px;"><label>Fecha</label><input type="date" name="date" value="${esc(v.date||'')}"></div>
      </div>
      <div class="field"><label>Entradilla (dek)</label><input name="dek" value="${esc(v.dek||'')}"></div>
      <div class="field"><label>Imagen de portada (URL, opcional)</label><input name="cover" value="${esc(v.cover||'')}" placeholder="https://..."></div>
      <div class="field"><label>Cuerpo — separa párrafos con una línea en blanco; una línea que empiece con “> ” es una cita destacada</label><textarea name="body">${esc(v.body||'')}</textarea></div>
      <div class="field"><label>Etiquetas (separadas por coma)</label><input name="tags" value="${esc((v.tags||[]).join(', '))}"></div>
      <div style="display:flex;gap:14px;align-items:center;padding:8px 0 20px;">
        <button type="submit" class="btn-primary">${p?'Guardar cambios':'Publicar'}</button>
        ${p?`<button type="button" class="btn-danger" onclick="delPost('${p.id}')">Eliminar</button>`:''}
      </div>
    </form>
  </section>`;
}

function saveForm(ev,id){
  ev.preventDefault();
  const f=ev.target;
  const data={
    title:f.title.value.trim(), section:f.section.value, date:f.date.value||new Date().toISOString().slice(0,10),
    dek:f.dek.value.trim(), cover:f.cover.value.trim(),
    body:f.body.value, tags:f.tags.value.split(',').map(t=>t.trim()).filter(Boolean)
  };
  if(id){ const p=POSTS.find(x=>x.id===id); Object.assign(p,data); }
  else { data.id='p'+Date.now(); POSTS.push(data); id=data.id; }
  save(POSTS); location.hash='#/post/'+id;
}
function delPost(id){
  if(!confirm('¿Eliminar esta entrada? No se puede deshacer.')) return;
  POSTS=POSTS.filter(x=>x.id!==id); save(POSTS); location.hash='#/';
}
function subscribe(ev){ ev.preventDefault(); const i=ev.target.querySelector('input'); i.value=''; i.placeholder='¡Gracias! Te escribo pronto.'; }

function router(){
  const h=location.hash||'#/';
  const el=document.getElementById('view');
  let html;
  let m;
  if((m=h.match(/^#\/post\/(.+)$/))) html=viewPost(m[1]);
  else if((m=h.match(/^#\/edit\/(.+)$/))) html=viewEditor(m[1]);
  else if(h==='#/new') html=viewEditor(null);
  else html=viewList();
  el.innerHTML=html;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',router);
router();
</script>
</body>
</html>
